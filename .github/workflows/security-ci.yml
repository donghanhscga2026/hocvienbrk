name: Security CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: security-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
  AUTH_SECRET: ci-only-not-for-production-ci-only-not-for-production
  NEXTAUTH_SECRET: ci-only-not-for-production-ci-only-not-for-production
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

jobs:
  tests:
    name: Behavior and security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Security P0 invariant tests
        run: node scripts/test-security-p0.cjs

      - name: Soft-404 slug guard tests
        run: node scripts/test-soft404-slug-guard.cjs

      - name: Booking feature invariant tests
        run: node scripts/test-booking.cjs

      - name: Website and custom domain isolation tests
        run: |
          npm run test:website-templates
          npm run test:custom-domains
          node scripts/test-domain-snapshot.cjs
          node scripts/test-page-template-courses.cjs
          node scripts/test-profile-course-visibility.cjs
          node scripts/test-page-template-assets.cjs
          node scripts/test-website-pages.cjs
          node scripts/test-website-management-access.cjs
          node scripts/test-page-crm-forms.cjs

      - name: CRM requests and personal space regression checks
        run: |
          node scripts/test-unified-teaching-role.cjs
          node scripts/test-learning-profiles.cjs
          node scripts/test-crm-request-workflow.cjs
          node scripts/test-crm-today.cjs
          node scripts/test-crm-request-ui.cjs
          node scripts/test-crm-request-bulk.cjs
          node scripts/test-crm-course-links.cjs
          node scripts/test-wi300-external-apps.cjs
          node scripts/test-wi300-personal-space.cjs
          node scripts/test-wi300-navigation.cjs
          node scripts/test-wi300-space-menu.cjs
          node scripts/test-unified-management-navigation.cjs
          node scripts/test-admin-accounts-media.cjs
          node scripts/test-legacy-templates.cjs
          node scripts/test-course-history.cjs
          node scripts/test-my-requests-ui.cjs
          node scripts/test-notification-pagination.cjs
          node scripts/test-notification-feed-ui.cjs
          node scripts/test-activation-email-content.cjs
          node scripts/test-pwa-install.cjs
          node scripts/test-wi300-partners.cjs
          node scripts/test-wi300-catalog-partners.cjs
          node scripts/test-wi300-performance.cjs
          node scripts/test-wi300-home-ecosystem.cjs
          node scripts/test-wi300-public-streaming.cjs
          node scripts/test-wi300-appearance.cjs
          node scripts/test-content-cms.cjs

      - name: Member ID change transaction and font checks
        run: |
          node scripts/test-user-id-change.cjs
          node scripts/test-normal-user-ids.cjs
          node scripts/test-normal-id-recovery.cjs
          node scripts/test-local-fonts.cjs

      - name: Course and project management regression checks
        run: |
          node scripts/test-wi300-projects.cjs
          node scripts/test-project-bulk.cjs
          node scripts/test-wi300-project-content.cjs
          node scripts/test-course-management-activity.cjs
          node scripts/test-management-workspace-ui.cjs
          node scripts/test-course-member-export.cjs
          node scripts/test-course-roster-workspace.cjs
          node scripts/test-course-student-ui.cjs
          node scripts/test-template-workspace.cjs
          node scripts/test-template-youtube.cjs
          node scripts/test-course-code.cjs
          node scripts/test-course-sales-flow.cjs
          node scripts/test-template-workspace-ui.cjs
          node scripts/test-course-builder-ui.cjs
          node scripts/test-course-template-publish.cjs
          node scripts/test-template-library-access.cjs
          node scripts/test-wi300-teacher-profile.cjs
          node scripts/test-wi300-course-hero.cjs
          node scripts/test-wi300-appearance.cjs

      - name: ZIP template source regression checks
        run: node scripts/test-zip-template-source.cjs

      - name: HTML template import regression checks
        run: node scripts/test-html-template-import.cjs

      - name: Template save regression checks
        run: node scripts/test-template-save.cjs

  typecheck:
    name: TypeScript and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint security-critical files
        run: >-
          npx eslint auth.ts auth.config.ts proxy.ts app/login/page.tsx
          app/api/auth/change-password/route.ts
          app/api/auth/report-failed-login/route.ts
          app/api/auth/reset-password/route.ts
          app/api/auth/forgot-password/route.ts
          lib/notifications.ts
          --rule "@typescript-eslint/no-explicit-any:off"
          --rule "react-hooks/set-state-in-effect:off"
          --rule "@typescript-eslint/no-unused-vars:warn"

      - name: Audit production dependencies
        run: npm audit --omit=dev

  build:
    name: Production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Production build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  verify:
    name: TypeScript, Prisma, Security & Build
    runs-on: ubuntu-24.04
    needs: [tests, typecheck, build]
    if: always()
    steps:
      - name: Gate on all parallel jobs
        run: |
          if [ "${{ needs.tests.result }}" != "success" ] || [ "${{ needs.typecheck.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
          echo "All checks passed."
