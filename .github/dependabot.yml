# Dependabot — tự mở PR cập nhật thư viện để vá lỗ hổng bảo mật sớm.
# GĐ1 lộ trình bảo mật (đề xuất trong báo cáo 23/10/2026).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Ghi chú: 2 ignore theo phiên bản (dompurify 3.4.17, @auth/core
    # 0.41.3) đã gỡ ở PR-3 (25/10/2026) — cả hai đều đã kiểm chứng tốt
    # trên master hiện tại: dompurify 3.4.17 vào qua chuẩn hóa lockfile
    # (PR #242, test-template-youtube xanh), @auth/core 0.41.3 đi cùng
    # next-auth 5.0.0-beta.32 nên hết xung đột kiểu TS2769. Lưu ý lệnh
    # "@dependabot ignore <gói>" từng chạy trên PR #233 lưu trạng thái
    # phía Dependabot, không nằm trong file này.
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
