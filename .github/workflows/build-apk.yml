name: Build APK thu nghiem

# Chi chay khi push len nhanh Capacitor hoac bam chay tay.
# Khong co schedule, khong dung vao cac workflow hien co.
on:
  push:
    branches:
      - feat/capacitor-shell-giautoandien
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Dung Android SDK preinstall cua runner (setup-android@v3 loi o goi legacy 'tools')
      # sdkmanager khong nam trong PATH mac dinh nen phai do duong dan day du
      - name: Install Android platform 36 and build-tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          echo "Using $SDKMANAGER (ANDROID_HOME=$ANDROID_HOME)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MFC-app-thu-nghiem
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
