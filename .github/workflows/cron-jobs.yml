name: Cron Jobs

on:
  schedule:
    - cron: '5 * * * *'
    - cron: '0 0 * * *'
    - cron: '0 5 * * *'
    - cron: '5 17 * * *'
    - cron: '*/15 * * * *'
    - cron: '20 1 * * *'
    - cron: '30 1 * * 1'
  workflow_dispatch:

jobs:
  crm-automation:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Process enabled CRM rules
        run: |
          curl --fail --silent --show-error --max-time 60 -X GET "${{ vars.SITE_URL }}/api/cron/crm-automation?execute=1" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  mbtca-orchestrator:
    if: github.event.schedule == '5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call mbtca-orchestrator
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ vars.SITE_URL }}/api/cron/mbtca-orchestrator" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  gmail-watch:
    if: github.event.schedule == '0 0 * * *' || github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call gmail-watch
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ vars.SITE_URL }}/api/cron/gmail-watch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  process-email-campaigns:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call process-email-campaigns
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ vars.SITE_URL }}/api/cron/process-email-campaigns" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  reset-sender-quota:
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call reset-sender-quota
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ vars.SITE_URL }}/api/cron/reset-sender-quota" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  brk-expiration:
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call brk-expiration
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ vars.SITE_URL }}/api/cron/brk-expiration" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  scan-bounces:
    if: github.event.schedule == '0 5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call scan-bounces
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ vars.SITE_URL }}/api/cron/scan-bounces" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  brk-grace-processing:
    if: github.event.schedule == '5 17 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call brk-grace-processing
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ vars.SITE_URL }}/api/cron/brk-grace-processing" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  web-push:
    if: ${{ vars.WEB_PUSH_ENABLED == 'true' && (github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Retry lesson push queue
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$SITE_URL" && test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 65 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/web-push?execute=1"

  academy-daily-sync:
    if: github.event.schedule == '20 1 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Sales ledger sync
        run: |
          curl --fail --silent --show-error --max-time 120 -X GET "${{ vars.SITE_URL }}/api/cron/sales-ledger" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Social (YouTube) sync
        run: |
          curl --fail --silent --show-error --max-time 300 -X GET "${{ vars.SITE_URL }}/api/cron/social-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Race points sync
        run: |
          curl --fail --silent --show-error --max-time 120 -X GET "${{ vars.SITE_URL }}/api/cron/race-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Badge awards
        run: |
          curl --fail --silent --show-error --max-time 300 -X GET "${{ vars.SITE_URL }}/api/cron/badge-awards" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Baseline reminders
        run: |
          curl --fail --silent --show-error --max-time 120 -X GET "${{ vars.SITE_URL }}/api/cron/baseline-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Affiliate commissions release (PENDING -> AVAILABLE)
        run: |
          curl --fail --silent --show-error --max-time 300 -X POST "${{ vars.SITE_URL }}/api/cron/process-commissions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Affiliate leaderboard snapshot (monthly)
        run: |
          curl --fail --silent --show-error --max-time 120 -X POST "${{ vars.SITE_URL }}/api/cron/affiliate-leaderboard" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  affiliate-weekly-check:
    if: github.event.schedule == '30 1 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Weekly missing-commission scan
        run: |
          curl --fail --silent --show-error --max-time 300 -X POST "${{ vars.SITE_URL }}/api/cron/affiliate-missing-commissions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
