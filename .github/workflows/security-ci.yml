name: Security CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: security-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript, Prisma, Security & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-not-for-production-ci-only-not-for-production
      NEXTAUTH_SECRET: ci-only-not-for-production-ci-only-not-for-production
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Website and custom domain isolation tests
        run: |
          npm run test:website-builder
          npm run test:custom-domains

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ZIP template source regression checks
        run: node scripts/test-zip-template-source.cjs

      - name: HTML template import regression checks
        run: node scripts/test-html-template-import.cjs

      - name: Lint security-critical files
        run: >-
          npx eslint auth.ts auth.config.ts proxy.ts app/login/page.tsx
          app/api/auth/change-password/route.ts
          app/api/auth/report-failed-login/route.ts
          app/api/auth/reset-password/route.ts
          app/api/auth/forgot-password/route.ts
          lib/notifications.ts
          --rule "@typescript-eslint/no-explicit-any:off"
          --rule "react-hooks/set-state-in-effect:off"
          --rule "@typescript-eslint/no-unused-vars:warn"

      - name: Audit production dependencies
        run: npm audit --omit=dev
        continue-on-error: true

      - name: Production build
        run: npm run build
